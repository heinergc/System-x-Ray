<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 475" role="img" aria-labelledby="title desc"><title id="title">System X-Ray: request to evidence</title><desc id="desc">Synthetic component map: POST request to API, business rule, and in-memory repository. Connections carry source evidence IDs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10" fill="#92a9bb"/></marker></defs><rect width="660" height="475" fill="#102332"/><g fill="none" stroke="#344f63" stroke-width="1"><path d="M35 25h590v415H35z"/><path d="M35 122h590M35 340h590" stroke-dasharray="3 6"/></g><g font-family="Arial, sans-serif"><text x="55" y="54" fill="#acc3d4" font-size="12">ENTRYPOINT / POST /orders</text><rect x="197" y="77" width="270" height="71" rx="7" fill="#d9f968"/><text x="218" y="104" fill="#102332" font-size="11" font-weight="700">API</text><text x="218" y="129" fill="#102332" font-size="22" font-weight="700">create_order()</text><path d="M332 149v63" stroke="#a8c580" stroke-width="2" marker-end="url(#arrow)"/><text x="344" y="182" fill="#acc3d4" font-size="11">EVIDENCIA-001</text><rect x="197" y="214" width="270" height="74" rx="7" fill="#203b50" stroke="#4e7290"/><text x="218" y="242" fill="#b9cee0" font-size="11" font-weight="700">BUSINESS RULE / RN-001</text><text x="218" y="268" fill="#fff" font-size="22" font-weight="700">quantity ≥ 1</text><path d="M332 288v57" stroke="#92a9bb" stroke-width="2" marker-end="url(#arrow)"/><text x="344" y="319" fill="#acc3d4" font-size="11">EVIDENCIA-002</text><rect x="197" y="348" width="270" height="70" rx="7" fill="#203b50" stroke="#4e7290"/><text x="218" y="375" fill="#b9cee0" font-size="11" font-weight="700">IN-MEMORY REPOSITORY</text><text x="218" y="400" fill="#fff" font-size="22" font-weight="700">save_order()</text><path d="M196 251H91v96" fill="none" stroke="#c99a77" stroke-width="1.5" marker-end="url(#arrow)"/><text x="50" y="286" fill="#dbb698