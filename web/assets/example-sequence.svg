<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" role="img" aria-labelledby="title desc"><title id="title">Create order: synthetic sequence</title><desc id="desc">A request calls the API and business rule. Valid quantity is saved in memory and receives 201. Invalid quantity returns 422 without persistence.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10" fill="#315bef"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10" fill="#69808f"/></marker></defs><rect width="660" height="490" fill="#f1f5f6"/><g font-family="Arial,sans-serif"><text x="28" y="37" font-size="17" font-weight="700" fill="#102332">PROC-001 / Create order</text><text x="28" y="59" font-size="11" fill="#50616d">SYNTHETIC EXAMPLE · SOURCE-BASED SEQUENCE</text><g fill="white" stroke="#ccd8df"><rect x="30" y="89" width="118" height="44" rx="4"/><rect x="187" y="89" width="118" height="44" rx="4"/><rect x="344" y="89" width="118" height="44" rx="4"/><rect x="501" y="89" width="130" height="44" rx="4"/></g><g fill="#102332" font-size="13" text-anchor="middle" font-weight="700"><text x="89" y="116">Request</text><text x="246" y="116">API</text><text x="403" y="116">Business rule</text><text x="566" y="116">Memory store</text></g><g stroke="#afc0cb" stroke-dasharray="4 5"><path d="M89 134v300M246 134v300M403 134v300M566 134v300"/></g><g fill="none" stroke="#315bef" stroke-width="1.5" marker-end="url(#a)"><path d="M89 179h155M246 222h155M403 301h161"/></g><g fill="#315bef" font-size="11" text-anchor="middle"><text x="167" y="167">POST /orders</text><text x="325" y="210">place_order()</text><text x="482" y="290">save_order()</text></g><rect x="326" y="245" width="160" height="27" rx="3" fill="#d9f968"/><text x="406" y="263" fill="#102332" font-size="12" font-weight="700" text-anchor="middle">RN-001 / quantity ≥ 1</text><g fill="none" stroke="#69808f" stroke-dasharray="4 4" marker-end="url(#b)"><path d="M566 341H405M403 377H248M246 413H91"/></g><g fill="#50616d" font-size="11" text-anchor="middle"><text x="482" y="331">{ id, product_id, quantity }</text><text x="325" y="367">order</text><text x="167" y="403">201 / order</text></g><path d="M30 456h600" stroke="#ccd8df"/><text x="30" y="479" fill="#50616d" font-size="11">quantity &lt; 1 → HTTP 422 · save_order() is not called.</text></g></svg>
